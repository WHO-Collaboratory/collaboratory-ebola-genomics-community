<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #24292e;
      background: #fff;
      margin: 0;
      padding: 0;
    }

    .page-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 32px 80px;
    }

    h1, h2, h3, h4 {
      line-height: 1.3;
      margin-top: 1.8em;
      margin-bottom: 0.5em;
    }
    h1 { font-size: 2em; border-bottom: 1px solid #e1e4e8; padding-bottom: 0.3em; }
    h2 { font-size: 1.5em; border-bottom: 1px solid #e1e4e8; padding-bottom: 0.2em; }
    h3 { font-size: 1.25em; }
    h4 { font-size: 1em; }

    p { margin: 0.8em 0; }

    a { color: #0366d6; text-decoration: none; }
    a:hover { text-decoration: underline; }

    img { max-width: 100%; height: auto; }

    hr { border: none; border-top: 1px solid #e1e4e8; margin: 2em 0; }

    blockquote {
      margin: 1em 0;
      padding: 0.5em 1em;
      border-left: 4px solid #dfe2e5;
      color: #6a737d;
      background: #f6f8fa;
    }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
      margin: 1em 0;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 0.9em;
    }
    th, td {
      border: 1px solid #dfe2e5;
      padding: 8px 12px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #f6f8fa;
      font-weight: 600;
    }
    tr:nth-child(even) td { background: #fafbfc; }

    /* Inline code */
    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.875em;
      background: #f3f4f5;
      padding: 2px 5px;
      border-radius: 3px;
    }
    pre code { background: none; padding: 0; }
    pre {
      background: #f6f8fa;
      padding: 16px;
      overflow-x: auto;
      border-radius: 4px;
      font-size: 0.875em;
    }

    ul, ol { padding-left: 2em; }
    li { margin: 0.25em 0; }
  </style>
</head>
<body>
  <div class="page-wrap">
    {{ content }}
  </div>
  <script>
    // Wrap every table in a scrollable div
    document.querySelectorAll('table').forEach(function(t) {
      var wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      t.parentNode.insertBefore(wrap, t);
      wrap.appendChild(t);
    });
  </script>
</body>
</html>
