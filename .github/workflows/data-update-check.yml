name: Check for data and literature updates

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily
  workflow_dispatch:        # Allow manual trigger from Actions tab

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit updated state file
      issues: write     # to create/comment on notification issue

    steps:
      - uses: actions/checkout@v4

      - name: Check APIs and notify on change
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 << 'EOF'
          import urllib.request
          import urllib.error
          import json
          import os
          import subprocess
          import sys

          STATE_FILE  = ".github/data-versions.json"
          REPO        = os.environ["GITHUB_REPOSITORY"]
          TOKEN       = os.environ["GITHUB_TOKEN"]
          DASHBOARD   = "https://who-collaboratory.github.io/collaboratory-ebola-genomics-community/dashboard.html"
          LABEL       = "data-updates"

          GH_HEADERS = {
              "Authorization": f"Bearer {TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def fetch_json(url, method="GET", body=None, headers=None, timeout=30):
              req = urllib.request.Request(url, method=method)
              for k, v in (headers or {}).items():
                  req.add_header(k, v)
              if body is not None:
                  req.data = json.dumps(body).encode()
                  req.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read())

          # ── Load stored state ──────────────────────────────────────────────
          with open(STATE_FILE) as f:
              state = json.load(f)

          first_run = not state.get("pathoplexus_sequence_count")

          # ── Fetch Pathoplexus LAPIS (aggregated — fast, returns count only) ─
          try:
              lapis = fetch_json(
                  "https://lapis.pathoplexus.org/ebola-bdbv/sample/aggregated"
                  # Without versionStatus this counts every version ever
                  # submitted: 1105 against 1055 current genomes, the
                  # difference being 39 superseded revisions and 11 revoked
                  # records. A revision to an existing genome would then read
                  # as new data.
                  "?outbreak=Bdbv-2026&versionStatus=LATEST_VERSION&dataFormat=JSON",
                  timeout=45
              )
              new_count = str(lapis["data"][0]["count"])
          except Exception as e:
              print(f"WARNING: LAPIS fetch failed — {e}", file=sys.stderr)
              new_count = state.get("pathoplexus_sequence_count", "")

          # ── Fetch Nextstrain ───────────────────────────────────────────────
          try:
              ns = fetch_json(
                  "https://nextstrain.org/charon/getDataset?prefix=ebola/bdbv",
                  timeout=45
              )
              new_nextstrain = ns["meta"]["updated"]
          except Exception as e:
              print(f"WARNING: Nextstrain fetch failed — {e}", file=sys.stderr)
              new_nextstrain = state.get("nextstrain_updated", "")

          # ── Fetch Virological (Ebolavirus category, incl. subcategories) ───
          # The Bundibugyo posts sit in a subcategory of Ebolavirus (id 9), so
          # include_subcategories is required; the category-slug-only URL
          # returns a payload with no topic_list at all.
          VIROLOGICAL = ("https://virological.org/c/ebolavirus/9/l/latest.json"
                         "?include_subcategories=true")
          seen_topics = state.get("virological_seen_topics")
          try:
              # Discourse rejects the default urllib user agent with a 403
              listing = fetch_json(
                  VIROLOGICAL, timeout=45,
                  headers={"User-Agent": f"{REPO} data-update-check",
                           "Accept": "application/json"})
              topics = [
                  t for t in listing["topic_list"]["topics"]
                  # "About the <x> category" is pinned boilerplate, not a post
                  if not t["title"].lower().startswith("about the")
              ]
          except Exception as e:
              print(f"WARNING: Virological fetch failed — {e}", file=sys.stderr)
              topics = []

          print(f"Pathoplexus sequences: {new_count} (stored: {state.get('pathoplexus_sequence_count', 'none')})")
          print(f"Nextstrain updated: {new_nextstrain} (stored: {state.get('nextstrain_updated', 'none')})")

          # ── Detect changes (skip notification on first run) ────────────────
          updates = []
          if not first_run:
              if new_count != state.get("pathoplexus_sequence_count"):
                  updates.append(
                      f"🗄️ **Pathoplexus** sequence count changed\n"
                      f"> Previous: `{state['pathoplexus_sequence_count']}` sequences  \n"
                      f"> New: `{new_count}` sequences"
                  )
              if new_nextstrain != state.get("nextstrain_updated"):
                  updates.append(
                      f"🌳 **Nextstrain** phylogeny updated\n"
                      f"> Previous: `{state['nextstrain_updated']}`  \n"
                      f"> New: `{new_nextstrain}`"
                  )

          # Virological has its own first-run state: the key is absent until the
          # first successful fetch, and a failed fetch must not seed it empty.
          new_topics = []
          if topics:
              if seen_topics is None:
                  print(f"First Virological check — recording {len(topics)} "
                        f"existing topics without notifying.")
              else:
                  known = set(seen_topics)
                  new_topics = [t for t in topics if t["id"] not in known]
                  print(f"Virological: {len(new_topics)} new topic(s) of "
                        f"{len(topics)} listed")

          for t in sorted(new_topics, key=lambda t: t["created_at"]):
              url = f"https://virological.org/t/{t['slug']}/{t['id']}"
              updates.append(
                  f"📄 **Virological** — new post in the Ebolavirus category\n"
                  f"> [{t['title']}]({url})  \n"
                  f"> Posted {t['created_at'][:10]}\n\n"
                  f"Methods or estimates in this post may need to reach "
                  f"[`landscape.md`](https://github.com/{REPO}/blob/main/landscape.md)."
              )

          if updates:
              # ── Find or create the notification issue ──────────────────────
              existing = fetch_json(
                  f"https://api.github.com/repos/{REPO}/issues"
                  f"?labels={LABEL}&state=open&per_page=1",
                  headers=GH_HEADERS
              )

              if existing:
                  issue_number = existing[0]["number"]
              else:
                  issue = fetch_json(
                      f"https://api.github.com/repos/{REPO}/issues",
                      method="POST",
                      body={
                          "title": "🔔 BDBV Dashboard — Data Update Notifications",
                          "body": (
                              "This issue tracks updates to the data shown in the "
                              f"[BDBV Genomics Community Dashboard]({DASHBOARD}).\n\n"
                              "**To receive email notifications** when Pathoplexus sequence data "
                              "or the Nextstrain phylogeny are updated, or a new Ebolavirus post "
                              "appears on Virological, subscribe to this issue: "
                              "click **Subscribe** in the right-hand panel.\n\n"
                              "_This issue is maintained automatically. Do not close it._"
                          ),
                          "labels": [LABEL],
                      },
                      headers=GH_HEADERS
                  )
                  issue_number = issue["number"]
                  print(f"Created notification issue #{issue_number}")

              # ── Post comment ───────────────────────────────────────────────
              comment_body = "### Data update detected\n\n" + "\n\n".join(updates)
              comment_body += f"\n\n[View dashboard]({DASHBOARD})"

              fetch_json(
                  f"https://api.github.com/repos/{REPO}/issues/{issue_number}/comments",
                  method="POST",
                  body={"body": comment_body},
                  headers=GH_HEADERS
              )
              print(f"Posted notification to issue #{issue_number}")

          else:
              print("No changes detected." if not first_run else "First run — storing current state, no notification sent.")

          # ── Persist updated state ──────────────────────────────────────────
          state["pathoplexus_sequence_count"] = new_count
          state["nextstrain_updated"]         = new_nextstrain
          if topics:
              # Keep the ids seen, not just those currently listed: the listing
              # returns only the newest ~25 topics, so a post would otherwise be
              # reported again once it falls off the end.
              merged = set(seen_topics or []) | {t["id"] for t in topics}
              state["virological_seen_topics"] = sorted(merged)[-300:]
          # Remove old dataVersion key if present
          state.pop("pathoplexus_data_version", None)

          with open(STATE_FILE, "w") as f:
              json.dump(state, f, indent=2)
              f.write("\n")

          subprocess.run(["git", "config", "user.name",  "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", STATE_FILE], check=True)

          diff = subprocess.run(["git", "diff", "--cached", "--quiet"])
          if diff.returncode != 0:
              subprocess.run(["git", "commit", "-m", "chore: update data version cache [skip ci]"], check=True)
              subprocess.run(["git", "push"], check=True)
              print("State file committed.")
          EOF
